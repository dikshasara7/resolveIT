<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background:url('https://www.discoverengineering.org/wp-content/uploads/2023/12/mj_11325_4.jpg') center/cover no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .login-box {
        background: rgba(255, 255, 255, 0.95);
        width: 340px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 0 18px rgba(0,0,0,0.25);
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 11px;
        margin: 10px 0;
        border-radius: 6px;
        border: 1px solid #bbb;
        font-size: 14px;
    }

    button {
        width: 100%;
        padding: 11px;
        margin-top: 12px;
        background: #0275ff;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover {
        background: #005fd1;
    }

    #msg {
        margin-top: 12px;
        font-size: 14px;
    }
</style>

</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>

    <input id="email" type="email" placeholder="Admin Email" required>
    <input id="password" type="password" placeholder="Password" required>

    <button onclick="login()">Login</button>
    <p id="msg"></p>
</div>

<script>
function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const msg = document.getElementById("msg");

    if (!email || !password) {
        msg.textContent = "Email and Password are required";
        msg.style.color = "red";
        return;
    }

    fetch("http://localhost:8080/auth/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
    })
    .then(res => {
        if (!res.ok) {
            throw new Error("Invalid credentials");
        }
        return res.text(); 
    })
    .then(token => {

        if (email !== "admin@gmail.com") {
            msg.textContent = "Access denied. Admin only.";
            msg.style.color = "red";
            return;
        }

        localStorage.setItem("token", token);
        localStorage.setItem("adminEmail", email);

        msg.textContent = "Admin login successful";
        msg.style.color = "green";

        setTimeout(() => {
            window.location.href = "admindashboard.html";
        }, 800);
    })
    .catch(() => {
        msg.textContent = "Invalid email or password";
        msg.style.color = "red";
    });
}
</script>

</body>
</html>
