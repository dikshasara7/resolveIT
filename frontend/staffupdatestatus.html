<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Update Issue Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: #f8fafc;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background: #1e293b;
  color: white;
}

.navbar h2 {
  margin: 0;
  font-size: 24px;
}

.navbar a {
  color: #cbd5e1;
  margin-left: 20px;
  text-decoration: none;
  font-weight: 500;
}

.navbar a:hover {
  color: white;
}

.container {
  padding: 40px;
}

h3 {
  margin-bottom: 20px;
  color: #1e293b;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

th, td {
  padding: 14px 18px;
  border-bottom: 1px solid #e5e7eb;
  text-align: left;
}

th {
  background: #1e293b;
  color: white;
}

tr:hover {
  background: #f1f5f9;
}

select {
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid #cbd5e1;
  font-weight: 600;
}

.update-btn {
  padding: 6px 14px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}

.update-btn:hover {
  background: #1e40af;
}
</style>
</head>

<body>

<div class="navbar">
  <h2>Update Issue Status</h2>
  <div>
    <a href="staffdashboard.html">Dashboard</a>
    <a href="slogout.html">Logout</a>
  </div>
</div>

<div class="container">
  <h3>Update Complaint Status</h3>

  <table>
    <thead>
      <tr>
        <th>Complaint ID</th>
        <th>Subject</th>
        <th>Current Status</th>
        <th>Update Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="statusTable"></tbody>
  </table>
</div>

<script>
const token = localStorage.getItem("token");
if (!token) window.location.href = "stafflogin.html";

fetch("http://localhost:8080/complaints/all", {
  headers: {
    "Authorization": "Bearer " + token
  }
})
.then(res => res.json())
.then(result => {

  if (!result.success) {
    alert(result.message);
    return;
  }

  const tbody = document.getElementById("statusTable");
  tbody.innerHTML = "";

  result.data.forEach(c => {

    const disabled = c.status === "RESOLVED" ? "disabled" : "";

    tbody.innerHTML += `
      <tr>
        <td>CMP-${String(c.complaintId).padStart(3, "0")}</td>
        <td>${c.subject}</td>
        <td>${c.status.replace("_"," ")}</td>
        <td>
          <select id="status-${c.complaintId}" ${disabled}>
            <option value="PENDING" ${c.status==="PENDING"?"selected":""}>Pending</option>
            <option value="IN_PROGRESS" ${c.status==="IN_PROGRESS"?"selected":""}>In Progress</option>
            <option value="RESOLVED" ${c.status==="RESOLVED"?"selected":""}>Resolved</option>
          </select>
        </td>
        <td>
          <button class="update-btn" ${disabled}
            onclick="updateStatus(${c.complaintId})">
            Update
          </button>
        </td>
      </tr>
    `;
  });
});

function updateStatus(id) {
  const newStatus = document.getElementById(`status-${id}`).value;

  fetch(`http://localhost:8080/complaints/status/${id}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ status: newStatus })
  })
  .then(res => res.json())
  .then(r => {
    if (r.success) {
      alert("Status updated successfully");
      location.reload();
    } else {
      alert(r.message);
    }
  });
}
</script>

</body>
</html>
