<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('https://static.vecteezy.com/system/resources/previews/047/784/391/non_2x/a-colorful-illustration-showcasing-various-components-of-industrial-machinery-including-gears-pumps-and-other-mechanical-parts-designed-in-a-flat-style-free-vector.jpg') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-box {
            background: #fff;
            padding: 25px;
            width: 350px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background: #0056b3;
        }

        .message {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="register-box">
    <h2>User Registration</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">

    <button id="registerBtn" onclick="registerUser()">Register</button>

    <div class="message" id="message"></div>
</div>

<script>
function registerUser() {
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();
    const message = document.getElementById("message");
    const button = document.getElementById("registerBtn");

    message.innerText = "";

    if (!username || !email || !password || !confirmPassword) {
        message.style.color = "red";
        message.innerText = "All fields are required!";
        return;
    }

    if (password !== confirmPassword) {
        message.style.color = "red";
        message.innerText = "Passwords do not match!";
        return;
    }

    button.disabled = true;

    fetch("http://localhost:8080/auth/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: username,
            email: email,
            password: password
        })
    })
    .then(response => response.text())
    .then(data => {
        if (data === "REGISTERED") {
            message.style.color = "green";
            message.innerText = "Registration successful! Redirecting to login...";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1000);
        } else {
            message.style.color = "red";
            message.innerText = "Registration failed";
            button.disabled = false;
        }
    })
    .catch(() => {
        message.style.color = "red";
        message.innerText = "Server error";
        button.disabled = false;
    });
}
</script>

</body>
</html>
