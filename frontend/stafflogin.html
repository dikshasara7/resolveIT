<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Login Page</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: url('https://www.discoverengineering.org/wp-content/uploads/2023/12/mj_11325_4.jpg') center/cover no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .login-box {
        background: rgba(255, 255, 255, 0.9);
        width: 320px;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 12px rgba(0,0,0,0.2);
        text-align: center;
    }

    h2 { 
        margin-bottom: 20px; 
        color: #003366;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 5px;
        border: 1px solid #bbb;
        font-size: 14px;
    }

    button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background: #0275ff;
        border: none;
        border-radius: 5px;
        color: white;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover { 
        background: #005fd1; 
    }

    #msg {
        margin-top: 10px;
        font-size: 14px;
        font-weight: 600;
    }
</style>

</head>
<body>

<div class="login-box">
    <h2>Staff Crew Login</h2>

    <input id="email" type="email" placeholder="Email ID" required>
    <input id="password" type="password" placeholder="Password" required>

    <button onclick="loginStaff()">Login</button>
    <p id="msg"></p>
</div>

<script>
function loginStaff() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const msg = document.getElementById("msg");

    if (!email || !password) {
        msg.textContent = "Email and Password are required";
        msg.style.color = "red";
        return;
    }

    fetch("http://localhost:8080/auth/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            password: password
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Invalid credentials");
        }
        return response.text();
    })
    .then(token => {

        if (!email.toLowerCase().includes("staff")) {
            msg.textContent = "Access denied. Staff only.";
            msg.style.color = "red";
            return;
        }

        localStorage.setItem("token", token);
        localStorage.setItem("staffEmail", email);

        msg.textContent = "Login successful";
        msg.style.color = "green";

        setTimeout(() => {
            window.location.href = "staffdashboard.html";
        }, 800);
    })
    .catch(() => {
        msg.textContent = "Invalid email or password";
        msg.style.color = "red";
    });
}
</script>

</body>
</html>
