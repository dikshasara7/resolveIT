<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body {
  margin: 0;
  font-family: "Inter", sans-serif;
}
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background: #0f172a;
  color: #fff;
}
.navbar .title {
  font-size: 25px;
  font-weight: 700;
}
.navbar .links a {
  margin-left: 20px;
  text-decoration: none;
  color: #cbd5e1;
}
.navbar .links a:hover {
  color: #fff;
}

.stats-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
  padding: 40px;
}

.stat-box {
  background: white;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.stat-title {
  font-size: 18px;
  color: #475569;
}
.stat-number {
  font-size: 40px;
  font-weight: 700;
}

.container {
  padding: 0 40px 40px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.card a {
  display: inline-block;
  margin-top: 10px;
  padding: 12px 18px;
  background: #2563eb;
  color: white;
  border-radius: 10px;
  text-decoration: none;
}

.table-container {
  padding: 40px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

th, td {
  padding: 15px;
  border-bottom: 1px solid #e5e7eb;
}

th {
  background: #0f172a;
  color: white;
}

button {
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  background: #2563eb;
  color: white;
  cursor: pointer;
}
button:disabled {
  background: #94a3b8;
}
</style>
</head>

<body>

<script>
const token = localStorage.getItem("token");
const adminEmail = localStorage.getItem("adminEmail");
if (!token || adminEmail !== "admin@gmail.com") {
  window.location.href = "adminlogin.html";
}
</script>

<div class="navbar">
  <div class="title">Admin Dashboard</div>
  <div class="links">
    <a href="aprofile.html">Profile</a>
    <a href="alogout.html">Logout</a>
  </div>
</div>

<div class="stats-container">
  <div class="stat-box">
    <div class="stat-title">Total Complaints</div>
    <div class="stat-number" id="totalCount">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-title">Resolved Complaints</div>
    <div class="stat-number" id="resolvedCount">0</div>
  </div>
</div>

<div class="container">
  <div class="card">
    <h3>Forward Complaint</h3>
    <a href="complaint.html">View All Complaints</a>
  </div>
  <div class="card">
    <h3>Update Status</h3>
    <a href="admintrack.html">Track</a>
  </div>
  <div class="card">
    <h3>Complaint History</h3>
    <a href="adminhistory.html">History</a>
  </div>
  <div class="card">
    <h3>Feedback</h3>
    <a href="adminfeedback.html">View Feedback</a>
  </div>
</div>

<div class="table-container">
<h2>All Complaints</h2>
<table>
<thead>
<tr>
<th>ID</th>
<th>Subject</th>
<th>Description</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="complaintTable"></tbody>
</table>
</div>

<script>
function loadComplaints() {
  fetch("http://localhost:8080/complaints/all", {
    headers: { "Authorization": "Bearer " + token }
  })
  .then(res => res.json())
  .then(result => {
    const list = result.data;
    const tbody = document.getElementById("complaintTable");
    tbody.innerHTML = "";

    document.getElementById("totalCount").innerText = list.length;
    document.getElementById("resolvedCount").innerText =
      list.filter(c => c.status === "RESOLVED").length;

    list.forEach(c => {
      const disabled = c.status === "RESOLVED";
      tbody.innerHTML += `
        <tr>
          <td>CMP-${String(c.complaintId).padStart(3,"0")}</td>
          <td>${c.subject}</td>
          <td>${c.description}</td>
          <td>${c.status}</td>
          <td>
            <button onclick="resolve(${c.complaintId})" ${disabled ? "disabled" : ""}>
              Resolve
            </button>
          </td>
        </tr>
      `;
    });
  });
}

function resolve(id) {
  fetch("http://localhost:8080/complaints/status/" + id, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ status: "RESOLVED" })
  })
  .then(res => res.json())
  .then(() => loadComplaints());
}

loadComplaints();
</script>

</body>
</html>
